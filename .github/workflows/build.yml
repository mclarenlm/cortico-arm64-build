name: Build Cortico (linux/arm64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Cortico release tag, e.g. v0.2.14'
        required: true
        default: 'v0.2.14'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Clone Cortico source
        run: |
          git clone --depth 1 --branch "${{ inputs.version }}" \
            https://github.com/Pal-AI-Lab/Cortico.git repo
          echo "--- source version ---"
          node -p "require('./repo/package.json').version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cortico:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/cortico:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Cortico ${{ inputs.version }} built for linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/cortico:${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
